version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Each Expo SDK pins exact versions of these (React and React Native
    # included, down to the patch), so even a patch bump fails Expo Doctor.
    # They only move together, via a deliberate SDK upgrade
    # (`npx expo install --fix` after bumping `expo`), never via Dependabot.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Versioned with the SDK, and its beta tags (19.0.0-beta-<hash>-<date>)
      # don't sort by date, so Dependabot "upgrades" it to older builds.
      - dependency-name: "babel-plugin-react-compiler"
      # The SDK also pins TypeScript (~5.9 for SDK 54); patches are fine.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Routine minor/patch updates are batched; major versions arrive as their
    # own PRs so one breaking upgrade can't hold back the rest.
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
