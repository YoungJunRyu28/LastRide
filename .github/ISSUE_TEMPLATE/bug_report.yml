name: Bug report
description: Report a reproducible non-security bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, credentials, tokens, precise locations, or other sensitive data here. Use SECURITY.md for security-sensitive reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior without including personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - iOS app
        - Android app
        - Web app
        - API / backend
        - LastRide for Business
        - Deployment / CI
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, addresses, coordinates, user data, and credentials before pasting.
