name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # An ephemeral Postgres for this run only — not the real (Neon) database.
    # api-server's cache and usage tests need a real Postgres to prove the
    # properties that matter (TTL expiry, and concurrent writes landing
    # correctly), which a mock cannot demonstrate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastride_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply database schema
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastride_test

      - name: Unit tests
        run: pnpm run test
