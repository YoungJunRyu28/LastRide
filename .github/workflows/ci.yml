name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # An ephemeral Postgres for this run only — not the real (Neon) database.
    # api-server's cache and usage tests need a real Postgres to prove the
    # properties that matter (TTL expiry, and concurrent writes landing
    # correctly), which a mock cannot demonstrate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastride_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply committed database migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Verify generated API clients
        run: pnpm run verify:codegen

      - name: Unit and integration tests
        run: pnpm run test

      - name: Block critical production dependency advisories
        run: pnpm audit --prod --audit-level=critical

      - name: Validate Expo project health
        working-directory: artifacts/last-ride
        run: npx --yes expo-doctor@1.20.4

      - name: Validate release infrastructure
        run: |
          python3 -m pip install --disable-pip-version-check --quiet cfn-lint==1.57.1
          cfn-lint infra/template.yaml
          bash -n infra/deploy.sh infra/rollback.sh artifacts/api-server/scripts/deploy-lambda.sh
          python3 -m py_compile infra/hooks/post_traffic.py

      - name: Build production artifacts
        run: pnpm run build:ci
        env:
          EXPO_PUBLIC_API_URL: https://api.invalid.example
          EXPO_PUBLIC_APP_JOIN_BASE_URL: https://lastride.example
