name: Station list

# The bundled list of passenger stations (artifacts/last-ride/lib/stationPointsData.ts)
# comes from 国土数値情報（鉄道データ）N02, published once a year. Once a month this
# looks for a newer edition; when there is one it rebuilds the list, runs the
# app's checks and opens a pull request. Merging it and sending the OTA update
# stay manual. Nothing new: it does nothing.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 5 * *" # the 5th of each month, 09:00 JST
  workflow_dispatch:

concurrency:
  group: station-list
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Look for a newer edition
        id: edition
        run: |
          set -euo pipefail
          current=$(grep -o 'STATION_POINTS_YEAR = "[0-9]*"' artifacts/last-ride/lib/stationPointsData.ts | grep -o '[0-9]\{4\}')
          echo "Bundled edition: N02-${current}"
          found=""
          for year in $((current + 2)) $((current + 1)); do
            yy=${year: -2}
            url="https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-${yy}/N02-${yy}_GML.zip"
            if curl -sfL -A "Mozilla/5.0" -m 300 -o /tmp/n02.zip "$url" && unzip -tq /tmp/n02.zip >/dev/null; then
              found=$year
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No newer edition published yet."
            exit 0
          fi
          branch="station-list-n02-${found}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request for N02-${found} is already open (branch $branch)."
            exit 0
          fi
          echo "year=$found" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Found N02-${found}."

      - name: Rebuild the list
        if: steps.edition.outputs.year
        run: |
          set -euo pipefail
          yy=${{ steps.edition.outputs.year }}
          yy=${yy: -2}
          mkdir -p /tmp/n02 && unzip -q /tmp/n02.zip -d /tmp/n02
          geojson=$(find /tmp/n02 -path '*UTF-8*' -name "N02-${yy}_Station.geojson" | head -1)
          test -n "$geojson"
          python3 artifacts/last-ride/scripts/build-station-points.py "$geojson" "$yy" | tee /tmp/build.txt

      - uses: pnpm/action-setup@v6.1.0
        if: steps.edition.outputs.year
        with:
          version: 10.34.6

      - uses: actions/setup-node@v7
        if: steps.edition.outputs.year
        with:
          node-version: 24
          cache: pnpm

      - name: Check the app with the new list
        if: steps.edition.outputs.year
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/last-ride run typecheck
          pnpm --filter @workspace/last-ride test

      - name: Open a pull request
        if: steps.edition.outputs.year
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          year=${{ steps.edition.outputs.year }}
          branch=${{ steps.edition.outputs.branch }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add artifacts/last-ride/lib/stationPointsData.ts
          git commit -m "Station list: 国土数値情報 N02-${year}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Station list: 国土数値情報 N02-${year}" \
            --body "$(printf 'A newer edition of 国土数値情報（鉄道データ）is out (N02-%s). The bundled station list was rebuilt and the app'"'"'s typecheck and tests pass with it.\n\n```\n%s\n```\n\nAfter merging, send it to phones with an OTA update (eas update).' "$year" "$(cat /tmp/build.txt)")"
