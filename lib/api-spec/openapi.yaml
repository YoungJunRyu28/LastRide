openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trains
    description: Train timetable lookups (last and first trains)
  - name: stations
    description: Station lookups
  - name: taxi
    description: Taxi estimates
  - name: walk
    description: Walking routes
  - name: addresses
    description: Address search
  - name: places
    description: Places to wait for the first train
  - name: usage
    description: Paid API usage
  - name: enterprise
    description: LastRide for Business organizer and event operations
  - name: event-participants
    description: Anonymous event participant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Verifies required server configuration and database connectivity.
      responses:
        "200":
          description: Ready to serve production traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Required configuration or database connectivity is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trains/last:
    get:
      operationId: getLastTrain
      tags: [trains]
      summary: Last train tonight
      description: >-
        The last departure from the origin station on the given service date
        that still reaches the destination station.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/FromName"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - $ref: "#/components/parameters/ToName"
        - $ref: "#/components/parameters/ServiceDate"
      responses:
        "200":
          description: Last train route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainRoute"
        "404":
          description: No train route between the stations on that date
        "502":
          description: Timetable provider unavailable
  /trains/first:
    get:
      operationId: getFirstTrain
      tags: [trains]
      summary: First train of the service day
      description: The first departure from the origin station on the given service date toward the destination.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/FromName"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - $ref: "#/components/parameters/ToName"
        - $ref: "#/components/parameters/ServiceDate"
      responses:
        "200":
          description: First train route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainRoute"
        "404":
          description: No train route between the stations on that date
        "502":
          description: Timetable provider unavailable
  /trains/partway:
    get:
      operationId: getPartwayTrainTaxi
      tags: [trains]
      summary: Train partway, then taxi
      description: >-
        After the full last-train route is gone, find the farthest station on
        that route that is still reachable after the user can board, then
        estimate a taxi from there to the final destination.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/FromName"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - $ref: "#/components/parameters/ToName"
        - $ref: "#/components/parameters/TaxiToLat"
        - $ref: "#/components/parameters/TaxiToLon"
        - $ref: "#/components/parameters/ServiceDate"
        - $ref: "#/components/parameters/EarliestBoardAtMs"
      responses:
        "200":
          description: Reachable rail segment plus remaining taxi estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartwayTrainTaxi"
        "404":
          description: No useful partway rail option remains
        "502":
          description: Timetable or routing provider unavailable
  /trains/disruptions:
    get:
      operationId: getTrainDisruptions
      tags: [trains]
      summary: Live disruption information for route lines
      description: >-
        Returns RescueNow disruption information matching the supplied rail
        line names. Returns an empty list when the optional provider product is
        unavailable so core planning remains unaffected.
      parameters:
        - name: lines
          in: query
          required: true
          description: Colon-separated Japanese line names from the current route
          schema: { type: string, minLength: 1, maxLength: 600 }
      responses:
        "200":
          description: Matching current disruptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainDisruption" }
  /stations/nearby:
    get:
      operationId: getNearbyStations
      tags: [stations]
      summary: Stations near a point
      description: Closest stations by walking route (accounting for station exits), nearest first.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - name: pace
          in: query
          required: true
          schema: { type: string, enum: [relaxed, normal, fast] }
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200":
          description: Nearby stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "502":
          description: Station provider unavailable
  /stations/search:
    get:
      operationId: searchStations
      tags: [stations]
      summary: Search stations by name
      parameters:
        - name: q
          in: query
          required: true
          description: Station name in Japanese or kana
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: Matching stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "502":
          description: Station provider unavailable
  /taxi:
    get:
      operationId: getTaxiEstimate
      tags: [taxi]
      summary: Taxi time and fare estimate
      description: Driving distance and time, with a fare estimate using regional rates and the late-night surcharge.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - name: startTime
          in: query
          required: true
          description: Departure time in Japan (YYYY-MM-DDThh:mm:ss)
          schema:
            {
              type: string,
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$",
            }
      responses:
        "200":
          description: Taxi estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxiEstimate"
        "404":
          description: No driving route
        "502":
          description: Routing provider unavailable
  /walk:
    get:
      operationId: getWalkRoute
      tags: [walk]
      summary: Walking route
      description: Walking distance and time along the pedestrian network, at the given pace.
      parameters:
        - $ref: "#/components/parameters/FromLat"
        - $ref: "#/components/parameters/FromLon"
        - $ref: "#/components/parameters/ToLat"
        - $ref: "#/components/parameters/ToLon"
        - name: pace
          in: query
          required: true
          schema: { type: string, enum: [relaxed, normal, fast] }
      responses:
        "200":
          description: Walking route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkRoute"
        "404":
          description: No walking route
        "502":
          description: Routing provider unavailable
  /addresses/search:
    get:
      operationId: searchAddresses
      tags: [addresses]
      summary: Search Japanese addresses
      parameters:
        - name: q
          in: query
          required: true
          description: Address text in Japanese (or a postal code)
          schema: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: Matching addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "502":
          description: Address provider unavailable
  /places/nearby:
    get:
      operationId: getNearbyPlaces
      tags: [places]
      summary: Places to stay near a point
      description: Net cafés, karaoke, capsule hotels and hotels within walking distance, nearest first.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Nearby places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"
        "502":
          description: Place provider unavailable
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Paid API usage
      description: Real (uncached) calls to each paid provider today and this month, in Japan time. Administrator-only in production.
      security: [{ usageAdminBearer: [] }]
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
  /enterprise/events:
    post:
      operationId: createEnterpriseEvent
      tags: [enterprise]
      summary: Create a hosted event
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateEnterpriseEventRequest" }
      responses:
        "201":
          description: Event created with its initial invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseEventCreated" }
        "401": { description: Organizer authentication required }
    get:
      operationId: listEnterpriseEvents
      tags: [enterprise]
      summary: List events visible to the organizer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Enterprise events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnterpriseEvent" }
        "401": { description: Organizer authentication required }
  /enterprise/events/{eventId}:
    get:
      operationId: getEnterpriseEvent
      tags: [enterprise]
      summary: Get an event and its private host roster
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseEventDetail" }
        "401": { description: Organizer authentication required }
        "404": { description: Event not found }
    patch:
      operationId: updateEnterpriseEvent
      tags: [enterprise]
      summary: Update or close an event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateEnterpriseEventRequest" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseEvent" }
        "401": { description: Organizer authentication required }
        "404": { description: Event not found }
  /enterprise/events/{eventId}/invite:
    post:
      operationId: createEnterpriseEventInvite
      tags: [enterprise]
      summary: Rotate the join credentials for an event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: New invite credentials; previous invites are revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseEventInvite" }
        "401": { description: Organizer authentication required }
        "404": { description: Event not found }
        "410": { description: Event is closed or expired }
  /enterprise/devices:
    post:
      operationId: registerEnterpriseHostDevice
      tags: [enterprise]
      summary: Register an organizer device for departure alerts
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostDeviceRegistration" }
      responses:
        "204": { description: Device registered }
        "401": { description: Organizer authentication required }
    delete:
      operationId: unregisterEnterpriseHostDevice
      tags: [enterprise]
      summary: Stop departure alerts on an organizer device
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostDeviceRegistration" }
      responses:
        "204": { description: Device unregistered }
        "401": { description: Organizer authentication required }
  /events/join:
    post:
      operationId: joinEnterpriseEvent
      tags: [event-participants]
      summary: Join a hosted event without creating a personal account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinEnterpriseEventRequest" }
      responses:
        "201":
          description: Anonymous event membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventParticipantSession" }
        "400": { description: Invalid or expired invite }
        "404": { description: Event not found }
        "409": { description: Event participant limit reached }
  /events/participant:
    patch:
      operationId: updateEventParticipant
      tags: [event-participants]
      summary: Update the current anonymous participant leave time
      parameters:
        - $ref: "#/components/parameters/ParticipantToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateEventParticipantRequest" }
      responses:
        "200":
          description: Participant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventParticipantSelf" }
        "401": { description: Invalid participant token }
        "410": { description: Event expired or closed }
    delete:
      operationId: leaveEnterpriseEvent
      tags: [event-participants]
      summary: Leave the current hosted event
      parameters:
        - $ref: "#/components/parameters/ParticipantToken"
      responses:
        "204": { description: Participant removed from active roster }
        "401": { description: Invalid participant token }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    usageAdminBearer:
      type: http
      scheme: bearer
      description: Server-configured administrator token for the private usage report.
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    ParticipantToken:
      name: X-Participant-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    FromLat:
      name: fromLat
      in: query
      required: true
      schema: { type: number }
    FromLon:
      name: fromLon
      in: query
      required: true
      schema: { type: number }
    FromName:
      name: fromName
      in: query
      required: true
      description: Japanese station name, used to pick the right station near the coordinates
      schema: { type: string }
    ToLat:
      name: toLat
      in: query
      required: true
      schema: { type: number }
    ToLon:
      name: toLon
      in: query
      required: true
      schema: { type: number }
    ToName:
      name: toName
      in: query
      required: true
      schema: { type: string }
    ServiceDate:
      name: date
      in: query
      required: true
      description: Rail service date (YYYYMMDD); trains after midnight belong to the previous date
      schema: { type: string, pattern: "^[0-9]{8}$" }
    TaxiToLat:
      name: taxiToLat
      in: query
      required: true
      schema: { type: number }
    TaxiToLon:
      name: taxiToLon
      in: query
      required: true
      schema: { type: number }
    EarliestBoardAtMs:
      name: earliestBoardAtMs
      in: query
      required: true
      description: Earliest epoch millisecond at which the user can board a train
      schema: { type: number }
  schemas:
    TrainRoute:
      type: object
      properties:
        departsAt:
          type: string
          description: Departure from the origin station (ISO 8601 with +09:00 offset)
        arrivesAt:
          type: string
          description: Arrival at the destination station (ISO 8601 with +09:00 offset)
        transfers:
          type: number
          description: Number of changes between trains
        fareYen:
          type: [number, "null"]
          description: One-way fare including express charges, in yen; null when unknown
        legs:
          type: array
          items:
            $ref: "#/components/schemas/TrainLeg"
      required: [departsAt, arrivesAt, transfers, fareYen, legs]
    Station:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Romanized name for display in English
        nameJa:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        region:
          type: string
        walkingMeters:
          type: number
        walkingMinutes:
          type: number
      required: [id, name, nameJa, latitude, longitude]
    UsageReport:
      type: object
      properties:
        date:
          type: string
        month:
          type: string
        today:
          type: object
          additionalProperties: { type: number }
        thisMonth:
          type: object
          additionalProperties: { type: number }
        monthlyLimits:
          type: object
          additionalProperties: { type: number }
      required: [date, month, today, thisMonth, monthlyLimits]
    Place:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [net-cafe, karaoke, capsule, hotel]
        latitude:
          type: number
        longitude:
          type: number
        distanceMeters:
          type: number
          description: Straight-line distance from the search point
        phone:
          type: string
        open24h:
          type: boolean
          description: Present only when opening hours are known
      required: [name, kind, latitude, longitude, distanceMeters]
    Address:
      type: object
      properties:
        name:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [name, latitude, longitude]
    WalkRoute:
      type: object
      properties:
        distanceMeters:
          type: number
        minutes:
          type: number
      required: [distanceMeters, minutes]
    TaxiEstimate:
      type: object
      properties:
        distanceMeters:
          type: number
        minutes:
          type: number
        fareYen:
          type: [number, "null"]
          description: Estimated fare in yen, excluding tolls; null when unavailable
      required: [distanceMeters, minutes, fareYen]
    PartwayStation:
      type: object
      properties:
        name: { type: string }
        nameJa: { type: string }
        latitude: { type: number }
        longitude: { type: number }
      required: [name, nameJa, latitude, longitude]
    PartwayTrainTaxi:
      type: object
      properties:
        train:
          $ref: "#/components/schemas/TrainRoute"
        taxiFrom:
          $ref: "#/components/schemas/PartwayStation"
        taxi:
          $ref: "#/components/schemas/TaxiEstimate"
        totalFareYen:
          type: [number, "null"]
      required: [train, taxiFrom, taxi, totalFareYen]
    TrainDisruption:
      type: object
      properties:
        line: { type: string }
        lineCode: { type: [string, "null"] }
        status: { type: string }
        title: { type: string }
        comment: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
      required: [line, lineCode, status, title, comment, updatedAt]
    TrainLeg:
      type: object
      properties:
        line:
          type: string
        lineEn:
          type: string
          description: English line name, or the Japanese name if it isn't recognised
        from:
          type: string
        fromEn:
          type: string
        to:
          type: string
        toEn:
          type: string
        departsAt:
          type: string
        arrivesAt:
          type: string
      required: [line, lineEn, from, fromEn, to, toEn, departsAt, arrivesAt]
    CreateEnterpriseEventRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        alertLeadMinutes:
          { type: number, minimum: 1, maximum: 120, default: 10 }
        participantLimit:
          { type: number, minimum: 1, maximum: 500, default: 30 }
      required: [title, startsAt, expiresAt]
    UpdateEnterpriseEventRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        alertLeadMinutes: { type: number, minimum: 1, maximum: 120 }
        participantLimit: { type: number, minimum: 1, maximum: 500 }
        status: { type: string, enum: [active, closed] }
    EnterpriseEvent:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, active, closed, expired] }
        alertLeadMinutes: { type: number }
        participantLimit: { type: number }
        participantCount: { type: number, minimum: 0 }
      required:
        [
          id,
          organizationId,
          title,
          startsAt,
          expiresAt,
          status,
          alertLeadMinutes,
          participantLimit,
          participantCount,
        ]
    EnterpriseEventCreated:
      allOf:
        - $ref: "#/components/schemas/EnterpriseEvent"
        - type: object
          properties:
            inviteToken: { type: string }
            joinCode: { type: string }
          required: [inviteToken, joinCode]
    HostDeviceRegistration:
      type: object
      properties:
        expoPushToken: { type: string, minLength: 20, maxLength: 255 }
        platform: { type: string, enum: [ios, android] }
      required: [expoPushToken, platform]
    EnterpriseEventInvite:
      type: object
      properties:
        inviteToken: { type: string }
        joinCode: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [inviteToken, joinCode, expiresAt]
    EventParticipantHostView:
      type: object
      description: Privacy-minimal host view. No location, route, station, or destination data.
      properties:
        id: { type: string }
        displayName: { type: string }
        leaveBy: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, left] }
        updatedAt: { type: string, format: date-time }
      required: [id, displayName, leaveBy, status, updatedAt]
    EnterpriseEventDetail:
      allOf:
        - $ref: "#/components/schemas/EnterpriseEvent"
        - type: object
          properties:
            participants:
              type: array
              items: { $ref: "#/components/schemas/EventParticipantHostView" }
          required: [participants]
    JoinEnterpriseEventRequest:
      type: object
      properties:
        inviteToken: { type: string, minLength: 32, maxLength: 256 }
        joinCode: { type: string, minLength: 4, maxLength: 12 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
      required: [displayName]
    EventParticipantSession:
      type: object
      properties:
        participantToken: { type: string }
        participant:
          $ref: "#/components/schemas/EventParticipantSelf"
        event:
          $ref: "#/components/schemas/ParticipantEventSummary"
      required: [participantToken, participant, event]
    EventParticipantSelf:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        leaveBy: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, left] }
      required: [id, displayName, leaveBy, status]
    ParticipantEventSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [id, title, expiresAt]
    UpdateEventParticipantRequest:
      type: object
      properties:
        leaveBy: { type: string, format: date-time }
      required: [leaveBy]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
