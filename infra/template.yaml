AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LastRide production/staging API and scheduled workers

Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, production]
    Default: staging
  AppSecretName:
    Type: String
    Description: Secrets Manager JSON secret containing LastRide runtime credentials.
  EnableCanary:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  CorsAllowedOrigins:
    Type: String
    Default: ""
  AlarmEmail:
    Type: String
    Default: ""
  ReserveConcurrency:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Reserve Lambda concurrency per function. New accounts start with a 10-execution limit that cannot fit any reservation; infra/deploy.sh turns this off until the limit is raised.
  EnableBusiness:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: LastRide for Business (organizer sign-in via Supabase). Off for v1; the Supabase keys are only read from the secret when on.

Conditions:
  UseCanary: !Equals [!Ref EnableCanary, "true"]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  BusinessEnabled: !Equals [!Ref EnableBusiness, "true"]
  ReservesConcurrency: !Equals [!Ref ReserveConcurrency, "true"]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "lastride-${Stage}-operations"

  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref OperationsTopic

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Named so the post-traffic hook can find it at run time (see PostTrafficHook).
      Name: !Sub "lastride-${Stage}-http"
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # Explicit log groups so logs expire. Names are built from Stage, not
  # !Ref <Function>, so there is no function <-> log group cycle, and the
  # functions point at them via LoggingConfig.LogGroup, so CloudFormation
  # creates each group before its function and Lambda never auto-creates an
  # unmanaged (never-expiring) one with the same name.
  PostTrafficHookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/CodeDeployHook_lastride-${Stage}-post-traffic"
      RetentionInDays: 30

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lastride-${Stage}-api"
      RetentionInDays: 30

  ScheduledLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lastride-${Stage}-scheduled"
      RetentionInDays: 30

  PostTrafficHook:
    Type: AWS::Serverless::Function
    Properties:
      # The SAM-generated CodeDeploy role (AWSCodeDeployRoleForLambda) may
      # only invoke hook functions whose names start with CodeDeployHook_.
      FunctionName: !Sub "CodeDeployHook_lastride-${Stage}-post-traffic"
      Runtime: python3.13
      Architectures: [arm64]
      CodeUri: hooks/
      Handler: post_traffic.handler
      Timeout: 15
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref PostTrafficHookLogGroup
      # Looks the API up by name when it runs. Passing the API's ID here would
      # make a cycle: HttpApi -> ApiFunction -> (DeploymentPreference) this hook.
      Environment:
        Variables:
          API_NAME: !Sub "lastride-${Stage}-http"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: "*"
            - Effect: Allow
              Action:
                - apigateway:GET
              Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lastride-${Stage}-api"
      CodeUri: ../artifacts/api-server/dist/
      Handler: lambda.handler
      Timeout: 15
      ReservedConcurrentExecutions: !If [ReservesConcurrency, 50, !Ref AWS::NoValue]
      AutoPublishAlias: live
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          LASTRIDE_STAGE: !Ref Stage
          LOG_LEVEL: info
          DB_POOL_MAX: "2"
          DB_CONNECTION_TIMEOUT_MS: "5000"
          DB_IDLE_TIMEOUT_MS: "10000"
          PROVIDER_TIMEOUT_MS: "5000"
          REQUIRE_USAGE_ACCOUNTING: "true"
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          DATABASE_URL: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:DATABASE_URL}}"
          ODPT_KEY: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:ODPT_KEY}}"
          SUPABASE_URL: !If [BusinessEnabled, !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:SUPABASE_URL}}", ""]
          SUPABASE_ANON_KEY: !If [BusinessEnabled, !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:SUPABASE_ANON_KEY}}", ""]
          USAGE_ADMIN_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:USAGE_ADMIN_TOKEN}}"
          EXPO_ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:EXPO_ACCESS_TOKEN}}"
          REVENUECAT_SECRET_KEY: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:REVENUECAT_SECRET_KEY}}"
          GROUP_INVITE_ENCRYPTION_KEY: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:GROUP_INVITE_ENCRYPTION_KEY}}"
          ENTERPRISE_BOOTSTRAP_EMAILS: ""
          ENTERPRISE_BOOTSTRAP_ORGANIZATION_NAME: LastRide Business
          ENTERPRISE_PUSH_INCLUDE_NAME: "false"
          # Group leave-time alerts: one EventBridge one-time schedule, kept pointing
          # at the next alert due (src/lib/leaveAlertSchedule.ts).
          LEAVE_ALERT_SCHEDULE_NAME: !Sub "lastride-${Stage}-leave-alert"
          # Recurring every 5 minutes, created only while group alerts are pending.
          LEAVE_ALERT_WATCHDOG_NAME: !Sub "lastride-${Stage}-leave-alert-watchdog"
          LEAVE_ALERT_TARGET_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lastride-${Stage}-scheduled:live"
          LEAVE_ALERT_ROLE_ARN: !GetAtt LeaveAlertSchedulerRole.Arn
          # The monthly timetable refresh lands here; the API checks for a newer one
          # every few hours and falls back to the copy bundled at deploy.
          TRANSIT_SNAPSHOT_BUCKET: !Ref TransitSnapshotBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:GetSchedule
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
              Resource:
                - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/lastride-${Stage}-leave-alert"
                - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/lastride-${Stage}-leave-alert-watchdog"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt LeaveAlertSchedulerRole.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${TransitSnapshotBucket.Arn}/*"
            # Without it, S3 answers a missing file with AccessDenied instead of NoSuchKey.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt TransitSnapshotBucket.Arn
      DeploymentPreference:
        Enabled: !If [UseCanary, true, false]
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref ApiErrorsAlarm
        Hooks:
          PostTraffic: !Ref PostTrafficHook
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Lets EventBridge Scheduler call the scheduled function for the one-time
  # leave-alert schedule (the ScheduleV2 events below get their own roles).
  LeaveAlertSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeScheduledFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lastride-${Stage}-scheduled"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lastride-${Stage}-scheduled:*"

  ScheduledFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lastride-${Stage}-scheduled"
      CodeUri: ../artifacts/api-server/dist/
      Handler: scheduled.handler
      Timeout: 45
      ReservedConcurrentExecutions: !If [ReservesConcurrency, 5, !Ref AWS::NoValue]
      AutoPublishAlias: live
      LoggingConfig:
        LogGroup: !Ref ScheduledLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          LASTRIDE_STAGE: !Ref Stage
          LOG_LEVEL: info
          DB_POOL_MAX: "2"
          DB_CONNECTION_TIMEOUT_MS: "5000"
          DB_IDLE_TIMEOUT_MS: "10000"
          PROVIDER_TIMEOUT_MS: "5000"
          REQUIRE_USAGE_ACCOUNTING: "true"
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          DATABASE_URL: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:DATABASE_URL}}"
          SUPABASE_URL: !If [BusinessEnabled, !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:SUPABASE_URL}}", ""]
          SUPABASE_ANON_KEY: !If [BusinessEnabled, !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:SUPABASE_ANON_KEY}}", ""]
          USAGE_ADMIN_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:USAGE_ADMIN_TOKEN}}"
          EXPO_ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:EXPO_ACCESS_TOKEN}}"
          ENTERPRISE_BOOTSTRAP_EMAILS: ""
          ENTERPRISE_BOOTSTRAP_ORGANIZATION_NAME: LastRide Business
          ENTERPRISE_PUSH_INCLUDE_NAME: "false"
          # Group leave-time alerts: one EventBridge one-time schedule, kept pointing
          # at the next alert due (src/lib/leaveAlertSchedule.ts).
          LEAVE_ALERT_SCHEDULE_NAME: !Sub "lastride-${Stage}-leave-alert"
          # Recurring every 5 minutes, created only while group alerts are pending.
          LEAVE_ALERT_WATCHDOG_NAME: !Sub "lastride-${Stage}-leave-alert-watchdog"
          LEAVE_ALERT_TARGET_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lastride-${Stage}-scheduled:live"
          LEAVE_ALERT_ROLE_ARN: !GetAtt LeaveAlertSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:GetSchedule
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
              Resource:
                - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/lastride-${Stage}-leave-alert"
                - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/lastride-${Stage}-leave-alert-watchdog"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt LeaveAlertSchedulerRole.Arn
      # The jobs run rarely so the scale-to-zero Postgres (Neon; free plan is 100
      # CU-hours a month) can sleep: any query more often than every ~5 minutes keeps
      # it awake, which alone would use ~180 CU-hours a month.
      Events:
        Cleanup:
          Type: ScheduleV2
          Properties:
            OmitName: true
            # Once a day at 08:05 JST, just after group nights end at 08:00.
            ScheduleExpression: "cron(5 8 * * ? *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            Input: '{"task":"cleanup"}'
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 300
            DeadLetterConfig:
              Type: SQS
              QueueLogicalId: CleanupScheduleDlq
        DepartureAlerts:
          Type: ScheduleV2
          Properties:
            OmitName: true
            # Night backstop. Group alerts, retries and receipt checks run from the
            # one-time schedule, and while alerts are pending a recurring watchdog
            # checks every 5 minutes, inside the 10-minute alert window
            # (src/lib/leaveAlertSchedule.ts). This covers only a write lost before
            # either was set (a crash between saving a leave time and scheduling),
            # and skips the database while the watchdog runs. Every 30 minutes,
            # 20:00-01:59 JST, so the scale-to-zero database sleeps the rest of the
            # day and on nights without groups (a query every <5 minutes would
            # keep it awake around the clock: ~180 CU-hours a month on Neon).
            ScheduleExpression: "cron(*/30 20-23,0-1 * * ? *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            Input: '{"task":"departureAlerts","backstop":true}'
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 300
            DeadLetterConfig:
              Type: SQS
              QueueLogicalId: DepartureAlertsScheduleDlq
        PushReceipts:
          Type: ScheduleV2
          Properties:
            OmitName: true
            # Group receipts are checked and their tickets deleted (within 2 hours)
            # from the one-time schedule, at the times they're due. This daily run,
            # just after the 08:05 cleanup while the database is awake anyway, is a
            # backstop for that and runs the Business receipt check.
            ScheduleExpression: "cron(10 8 * * ? *)"
            State: ENABLED
            ScheduleExpressionTimezone: Asia/Tokyo
            Input: '{"task":"pushReceipts"}'
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 300
            DeadLetterConfig:
              Type: SQS
              QueueLogicalId: PushReceiptsScheduleDlq

  # Timetables (ODPT open data) refreshed monthly by TransitRefreshFunction.
  # Private; earlier versions kept 60 days to roll back a bad refresh.
  TransitSnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lastride-${Stage}-transit-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTimetables
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 60

  TransitRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lastride-${Stage}-transit-refresh"
      RetentionInDays: 30

  # Rebuilds the timetable snapshot from ODPT and stores it in the bucket
  # (src/transitRefresh.ts). The API refuses timetables over 30 days old, so it
  # runs twice a month: one failed run still leaves time for the next. No
  # database use. A broken result isn't published (the previous one stays) and
  # raises TransitRefreshErrorsAlarm.
  TransitRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lastride-${Stage}-transit-refresh"
      CodeUri: ../artifacts/api-server/dist/
      Handler: transitRefresh.handler
      # Downloads ODPT's full timetable dumps: ~10 s and ~550 MB measured (Oct 2026), with headroom.
      Timeout: 300
      MemorySize: 1536
      LoggingConfig:
        LogGroup: !Ref TransitRefreshLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          LASTRIDE_STAGE: !Ref Stage
          LOG_LEVEL: info
          ODPT_KEY: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:ODPT_KEY}}"
          TRANSIT_SNAPSHOT_BUCKET: !Ref TransitSnapshotBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${TransitSnapshotBucket.Arn}/*"
            # Without it, S3 answers a missing file (the first refresh) with
            # AccessDenied instead of NoSuchKey.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt TransitSnapshotBucket.Arn
      Events:
        Refresh:
          Type: ScheduleV2
          Properties:
            OmitName: true
            # 04:30 JST on the 1st and 15th, when nobody is waiting for a last train.
            ScheduleExpression: "cron(30 4 1,15 * ? *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            Input: '{}'
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600

  TransitRefreshErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: LastRide timetable refresh failed (the previous timetable stays; it expires after 30 days)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TransitRefreshFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Sustained errors only (>=5/min for 2 consecutive minutes): the API fans
      # out to third-party providers, and this alarm gates canary deployments.
      AlarmDescription: LastRide API Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: LastRide API Lambda throttles
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  ScheduledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Repeated failures across two 5-minute windows, not a single retry.
      AlarmDescription: LastRide scheduled worker errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduledFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

Outputs:
  ApiUrl:
    Description: LastRide API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionName:
    Value: !Ref ApiFunction
  ScheduledFunctionName:
    Value: !Ref ScheduledFunction
  OperationsTopicArn:
    Value: !Ref OperationsTopic
  TransitSnapshotBucketName:
    Value: !Ref TransitSnapshotBucket
  TransitRefreshFunctionName:
    Value: !Ref TransitRefreshFunction
